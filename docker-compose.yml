services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_MIDTRANS_CLIENT_KEY: ${VITE_MIDTRANS_CLIENT_KEY:-}
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      # Database — gunakan Supabase PostgreSQL
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      # Auth
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-tiarafaratama@gmail.com}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Supabase (untuk file upload & supabase-exchange)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      # AI
      - AI_INTEGRATIONS_OPENAI_API_KEY=${AI_INTEGRATIONS_OPENAI_API_KEY:-}
      - AI_INTEGRATIONS_OPENAI_BASE_URL=${AI_INTEGRATIONS_OPENAI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-qwen-turbo}
      # Payment
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-}
      - VITE_MIDTRANS_CLIENT_KEY=${VITE_MIDTRANS_CLIENT_KEY:-}
      # App URL (Railway public domain, e.g. https://aidea-creative-production.up.railway.app)
      - APP_URL=${APP_URL:-}
    restart: unless-stopped
