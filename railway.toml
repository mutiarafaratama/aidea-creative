[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# VITE_ vars perlu dipass sebagai Docker build args agar ter-bundle ke frontend
[build.args]
VITE_SUPABASE_URL = "$VITE_SUPABASE_URL"
VITE_SUPABASE_ANON_KEY = "$VITE_SUPABASE_ANON_KEY"
VITE_MIDTRANS_CLIENT_KEY = "$VITE_MIDTRANS_CLIENT_KEY"

[deploy]
startCommand = "node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Env vars wajib di Railway — set di dashboard Railway → Variables:
# SUPABASE_DATABASE_URL   = postgresql://... (connection string Supabase)
# SESSION_SECRET          = random string panjang
# ADMIN_EMAILS            = tiarafaratama@gmail.com
# GOOGLE_CLIENT_ID        = dari Google Cloud Console
# GOOGLE_CLIENT_SECRET    = dari Google Cloud Console
# GOOGLE_REDIRECT_URI     = https://<domain-railway-kamu>/api/auth/google/callback
# APP_URL                 = https://<domain-railway-kamu>
# SUPABASE_URL            = https://<project>.supabase.co
# SUPABASE_SERVICE_ROLE_KEY = dari Supabase Settings > API
# VITE_SUPABASE_URL       = sama dengan SUPABASE_URL
# VITE_SUPABASE_ANON_KEY  = dari Supabase Settings > API > anon key
# MIDTRANS_SERVER_KEY     = dari Midtrans dashboard
# VITE_MIDTRANS_CLIENT_KEY = dari Midtrans dashboard
# AI_INTEGRATIONS_OPENAI_API_KEY = AI provider key
# AI_INTEGRATIONS_OPENAI_BASE_URL = AI provider base URL
# AI_MODEL                = qwen-turbo (atau model lain)
